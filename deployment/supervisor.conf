[program:kqxs-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/kqxs.online/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/kqxs.online/storage/logs/worker.log
stopwaitsecs=3600

[program:kqxs-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /var/www/html/kqxs.online/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/kqxs.online/storage/logs/scheduler.log
stopwaitsecs=60
